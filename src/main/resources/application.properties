spring.application.name=market-backend-2026-3-b
spring.profiles.active=dev






# Optimización de recursos en entorno de desarrollo
# Se deshabilita JTA (transacciones distribuidas) ya que no se usan en este proyecto
spring.jta.enabled=false

# Se reduce el nivel de logging a WARN para disminuir carga en CPU y I/O
# Cambiar a DEBUG o INFO solo cuando se necesite diagnosticar un problema
logging.level.root=WARN